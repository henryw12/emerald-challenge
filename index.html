<script>
const WORKER_URL = "https://sam-rank-tracker.hwong951.workers.dev";
const DDRAGON_VER = "14.19.1";
const CHAMP_IMG = `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VER}/img/champion`;
const ITEM_IMG = `https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VER}/img/item`;
const CREST_BASE = "https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-";

const $ = id => document.getElementById(id);
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const esc = value => String(value ?? "").replace(
  /[&<>"']/g,
  c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c])
);
const cap = value => value.charAt(0).toUpperCase() + value.slice(1);

const TIERS = [
  "iron", "bronze", "silver", "gold", "platinum",
  "emerald", "diamond", "master", "grandmaster", "challenger"
];

const DIVISIONS = ["IV", "III", "II", "I"];
const LADDER_TIERS = [
  ["silver", 4], ["gold", 4], ["platinum", 4], ["emerald", 1]
];

const LADDER = LADDER_TIERS.flatMap(([tier, count]) =>
  DIVISIONS.slice(0, count).map(div => ({ tier, div }))
);

function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach((button, i) => {
    button.classList.toggle("active", i === (name === "sam" ? 0 : 1));
  });

  $("tab-sam").classList.toggle("active", name === "sam");
  $("tab-leaderboard").classList.toggle("active", name === "leaderboard");
}

function buildStepper() {
  $("stepper").style.setProperty("--n", LADDER.length);

  $("steps").innerHTML = LADDER.map((step, i) => `
    <li class="step${i === LADDER.length - 1 ? " goal" : ""}">
      <span class="node">${i === LADDER.length - 1 ? "🏆" : step.div}</span>
      <span class="step-sub"></span>
    </li>
  `).join("");

  $("tier-groups").innerHTML = LADDER_TIERS.map(([tier, count]) => `
    <span data-tier="${tier}" style="grid-column:span ${count}">
      ${cap(tier)}
    </span>
  `).join("");
}

function updateStepper(tier, division, lp) {
  const t = TIERS.indexOf(tier);
  const d = DIVISIONS.indexOf(division);
  const pos = t < 0
    ? -1
    : (t - TIERS.indexOf("silver")) * 4 + Math.max(0, d);

  [...$("steps").children].forEach((step, i) => {
    step.classList.toggle("passed", i < pos);
    step.classList.toggle("active", i === pos);
    step.toggleAttribute("aria-current", i === pos);
    step.querySelector(".step-sub").textContent =
      i === pos ? `${lp} LP` : "";
  });

  [...$("tier-groups").children].forEach(group => {
    group.classList.toggle("current", group.dataset.tier === tier);
  });

  $("active-line").style.width =
    `${clamp(pos / (LADDER.length - 1) * 100, 0, 100)}%`;
}

function setEmblem(tier) {
  const wrapper = $("emblem-wrapper");
  const img = $("rank-emblem");

  wrapper.classList.remove("is-fallback");

  if (!TIERS.includes(tier)) {
    img.removeAttribute("src");
    img.alt = "Unranked";
    wrapper.classList.add("is-fallback");
    return;
  }

  img.alt = `${cap(tier)} rank emblem`;
  img.onerror = () => wrapper.classList.add("is-fallback");
  img.src = `${CREST_BASE}${tier}.png`;
}

function notice(view, message) {
  const parent = $(view === "sam" ? "tab-sam" : "tab-leaderboard");
  const id = `${view}-notice`;
  let element = $(id);

  if (!element) {
    element = document.createElement("p");
    element.id = id;
    element.setAttribute("role", "status");
    element.style.cssText =
      "text-align:center;color:var(--muted);font-size:0.85rem";
    parent.prepend(element);
  }

  element.textContent = message;
}

async function api(view, params = {}, retryNotice = () => {}) {
  const url = new URL(WORKER_URL);
  url.searchParams.set("view", view);

  for (const [key, value] of Object.entries(params)) {
    url.searchParams.set(key, value);
  }

  for (let attempt = 0; attempt < 3; attempt++) {
    const response = await fetch(url, {
      headers: { Accept: "application/json" },
      cache: "no-store",
      signal: AbortSignal.timeout(90000)
    });

    if (response.status === 429 && attempt < 2) {
      const raw = Number(response.headers.get("Retry-After"));
      const seconds = Number.isFinite(raw) && raw > 0
        ? Math.ceil(raw)
        : 120;

      await response.text();
      retryNotice(`Riot cooldown: retrying in ${seconds}s…`);
      await sleep((seconds + 1) * 1000);
      continue;
    }

    const data = await response.json();

    if (!response.ok || data.error) {
      throw new Error(data.message || `Worker returned ${response.status}`);
    }

    return data;
  }
}

function updateLeaderboard(list) {
  $("leaderboard-container").innerHTML = list.map((p, i) => {
    const tier = String(p.tier).toLowerCase();
    const total = Number(p.wins) + Number(p.losses);
    const winrate = total ? Math.round(p.wins / total * 100) : 0;

    const badge = TIERS.includes(tier)
      ? `<img class="rank-badge-lg"
           src="${CREST_BASE}${tier}.png"
           alt="${esc(p.tier)}"
           onerror="this.style.visibility='hidden'">`
      : `<span class="rank-badge-lg" style="display:inline-grid;place-items:center">—</span>`;

    return `
      <div class="player-row-card">
        <div class="player-info-group">
          <span style="font-size:1.15rem;font-weight:900;color:var(--muted);width:24px">
            #${i + 1}
          </span>
          ${badge}
          <div>
            <div class="player-name-alias">${esc(p.alias)}</div>
            <div class="player-riot-id">
              ${esc(p.gameName)}#${esc(p.tagLine)}
            </div>
          </div>
        </div>
        <div class="player-rank-stats">
          <div class="tier-label">
            ${esc(p.tier)} ${esc(p.division)}
          </div>
          <div class="lp-sub">
            ${Number(p.lp)} LP |
            <span class="win-num">${Number(p.wins)}W</span>
            <span class="loss-num">${Number(p.losses)}L</span>
            (${winrate}%)
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function updateSamUI(sam) {
  const tier = String(sam.tier).toLowerCase();
  setEmblem(tier);
  updateStepper(tier, sam.division, sam.lp);

  $("current-tier").textContent = `${sam.tier} ${sam.division}`;
  $("current-lp").textContent = `${sam.lp} LP`;

  $("current-record").innerHTML = `
    <span class="win-num">${Number(sam.wins)}W</span>
    <span class="loss-num">${Number(sam.losses)}L</span>
    (${Number(sam.winrate)}% Win Rate)
  `;

  const live = sam.liveGame;
  const banner = $("live-status-banner");

  banner.className =
    `live-status-banner ${live?.inGame ? "is-live" : "not-live"}`;

  banner.innerHTML = `<span class="status-dot"></span> ${
    live?.inGame
      ? `LIVE IN GAME (${Number(live.gameLengthMin)}m)`
      : live?.checked ? "NOT LIVE" : "LIVE STATUS UNAVAILABLE"
  }`;

  const streak = sam.statsTracker?.streak || { count: 0 };
  const streakEl = $("streak-banner");

  streakEl.className = "streak-banner " +
    (streak.count
      ? streak.type === "win" ? "hot-streak" : "tilt-detector"
      : "neutral-streak");

  streakEl.textContent = streak.count
    ? `${streak.type === "win" ? "🔥" : "❄️"} ${streak.count} ${
        streak.type === "win" ? "WIN" : "LOSS"
      } STREAK`
    : "No recent streak";

  const estimatedLp = Number(sam.statsTracker?.todayLpChange) || 0;

  $("stat-lp").textContent =
    `${estimatedLp >= 0 ? "+" : ""}${estimatedLp} LP`;

  $("stat-lp").title =
    "Estimate from recent five matches: +18 per win, -16 per loss";

  $("stat-lp").style.color =
    estimatedLp >= 0 ? "var(--win)" : "var(--loss)";

  const champions = sam.analytics?.topChampions || [];

  $("top-champs-list").innerHTML = champions.length
    ? champions.map(c => `
        <div class="champ-row">
          <div style="display:flex;align-items:center;gap:0.6rem">
            <img src="${CHAMP_IMG}/${encodeURIComponent(c.name)}.png"
                 alt="${esc(c.name)}"
                 onerror="this.style.visibility='hidden'">
            <span>${esc(c.name)}</span>
          </div>
          <div style="display:flex;gap:1rem;font-size:0.85rem">
            <span>${Number(c.games)} games</span>
            <span class="${c.winrate >= 50 ? "win-num" : "loss-num"}">
              ${Number(c.winrate)}%
            </span>
          </div>
        </div>
      `).join("")
    : '<span class="empty-note">No challenge games in the recent five.</span>';

  const days = sam.analytics?.dailyBreakdown || [];

  $("daily-lp-list").innerHTML = days.length
    ? days.map(day => `
        <div class="daily-row-centered">
          <span class="daily-date">${esc(day.date)}</span>
          <div class="daily-stats">
            <span>${Number(day.wins)}W - ${Number(day.losses)}L</span>
            <span class="${day.netLp >= 0 ? "win-num" : "loss-num"}">
              ${day.netLp >= 0 ? "+" : ""}${Number(day.netLp)} LP est.
            </span>
          </div>
        </div>
      `).join("")
    : '<span class="empty-note">No recent challenge matches.</span>';

  $("macro-analysis-text").textContent = "Loading AI commentary…";

  const matches = sam.matches || [];

  $("matches-list").innerHTML = matches.length
    ? matches.map((m, i) => `
        <article class="match-card ${m.win ? "win" : "loss"}">
          <div class="match-top-row">
            <div class="champ-identity">
              <img class="champ-avatar"
                   src="${CHAMP_IMG}/${encodeURIComponent(m.champion)}.png"
                   alt="${esc(m.champion)}"
                   onerror="this.style.visibility='hidden'">
              <div class="champ-name-role">
                <span class="champ-name">${esc(m.champion)}</span>
                <span class="champ-role">
                  ${esc(m.lane)} • ${Number(m.durationMin)}m (Solo/Duo)
                </span>
              </div>
            </div>
            <div class="match-kda-stat">
              ${Number(m.kills)} / ${Number(m.deaths)} / ${Number(m.assists)}
              <span>(${Number(m.cs)} CS)</span>
            </div>
            <span class="match-badge">${m.win ? "Victory" : "Defeat"}</span>
          </div>
          <div class="items-container">
            <span class="item-label">Build:</span>
            ${(m.items || []).map(id => `
              <div class="item-slot">
                <img src="${ITEM_IMG}/${Number(id)}.png"
                     alt="Item ${Number(id)}"
                     loading="lazy"
                     onerror="this.closest('.item-slot').remove()">
              </div>
            `).join("") || '<span class="empty-note">No items</span>'}
          </div>
          <div class="match-roast" id="roast-${i}">
            Loading AI commentary…
          </div>
        </article>
      `).join("")
    : '<span class="empty-note">No recent Solo/Duo matches.</span>';
}

async function loadCoaching(matches) {
  try {
    const data = await api("coach");
    $("macro-analysis-text").textContent = data.text;
  } catch (error) {
    $("macro-analysis-text").textContent =
      `AI commentary unavailable: ${error.message}`;
  }

  for (let i = 0; i < matches.length; i++) {
    try {
      const data = await api("coach", {
        match: matches[i].matchId
      });

      if ($(`roast-${i}`)) {
        $(`roast-${i}`).textContent = data.text;
      }
    } catch (error) {
      if ($(`roast-${i}`)) {
        $(`roast-${i}`).textContent =
          `AI commentary unavailable: ${error.message}`;
      }
    }
  }
}

let historyRunning = false;

async function loadHistoryTotals() {
  if (historyRunning) return;
  historyRunning = true;

  $("stat-oct").textContent = "Counting…";
  $("stat-hours").textContent = "Counting…";
  $("stat-today").textContent = "Counting…";

  const games = new Map();
  const endTime = Math.floor(Date.now() / 1000);
  let start = 0;

  try {
    while (true) {
      const data = await api(
        "history",
        { start, endTime },
        message => {
          $("stat-oct").textContent = "Waiting…";
          $("stat-hours").textContent = "Waiting…";
          notice("sam", message);
        }
      );

      for (const game of data.games) {
        games.set(game.id, game);
      }

      if (data.done) break;

      if (data.nextStart <= start) {
        throw new Error("History pagination stalled.");
      }

      start = data.nextStart;
      notice("sam", `Counting history: ${games.size} games collected…`);
      await sleep(1000);
    }

    const values = [...games.values()];

    const seconds = values.reduce(
      (total, game) => total + game.seconds, 0
    );

    const today = new Date().toLocaleDateString("en-CA", {
      timeZone: "America/New_York"
    });

    $("stat-oct").textContent = games.size;
    $("stat-hours").textContent = `${(seconds / 3600).toFixed(1)}h`;

    $("stat-today").textContent =
      values.filter(game => game.date === today).length;

    $("stat-oct").title =
      "All collected ranked Solo/Duo games since Sep 30, midnight Eastern";

    $("stat-hours").title =
      "Sum of match durations since Sep 30; excludes queue time";

    notice("sam", "Game count and match time updated through this page load.");
  } catch (error) {
    $("stat-oct").textContent = "Retry";
    $("stat-hours").textContent = "Retry";
    $("stat-today").textContent = "—";

    notice("sam", `History failed: ${error.message}. Click Retry.`);
  } finally {
    historyRunning = false;
  }
}

async function loadAllData() {
  // Hide the blocking overlay; each section shows its own status.
  $("sync-overlay")?.classList.add("hidden");

  notice("leaderboard", "Loading ranks…");

  try {
    const data = await api(
      "leaderboard", {},
      message => notice("leaderboard", message)
    );

    updateLeaderboard(data.leaderboard);
    notice("leaderboard", (data.warnings || []).join(" • "));
  } catch (error) {
    notice("leaderboard", `Unable to load ranks: ${error.message}`);

    $("leaderboard-container").textContent =
      "Rank data unavailable. Refresh after the cooldown.";
  }

  notice("sam", "Loading Sam's rank and recent matches…");

  let recentMatches = [];

  try {
    const data = await api(
      "sam", {},
      message => notice("sam", message)
    );

    updateSamUI(data.samView);
    recentMatches = data.samView.matches || [];
    notice("sam", (data.warnings || []).join(" • "));

    // Runs in the background; totals do not wait for AI.
    loadCoaching(recentMatches);
  } catch (error) {
    notice("sam", `Unable to load Sam: ${error.message}`);
    $("macro-analysis-text").textContent = "Sam's data is unavailable.";
  }

  await loadHistoryTotals();
}

// Labels make the scope of each statistic clear.
$("stat-oct").parentElement.querySelector(".stat-lbl").textContent =
  "Games Since Sep 30";

$("stat-hours").parentElement.querySelector(".stat-lbl").textContent =
  "Match Time Since Sep 30";

$("stat-lp").parentElement.querySelector(".stat-lbl").textContent =
  "Estimated LP (Recent 5)";

document.querySelectorAll(".analytics-box-title").forEach(element => {
  if (element.textContent.includes("Champions")) {
    element.textContent = "🔥 Top Champions (Recent 5)";
  } else if (element.textContent.includes("LP")) {
    element.textContent = "📅 Estimated LP (Recent 5)";
  }
});

$("stat-oct").onclick = loadHistoryTotals;
$("stat-hours").onclick = loadHistoryTotals;

buildStepper();

const START = Date.parse("2026-09-30T00:00:00-04:00");
const END = Date.parse("2026-10-31T23:59:59-04:00");
const UNITS = [86400000, 3600000, 60000, 1000];

function updateCountdown() {
  let remaining = Math.max(0, END - Date.now());

  ["days", "hours", "minutes", "seconds"].forEach((id, i) => {
    const value = Math.floor(remaining / UNITS[i]);
    remaining -= value * UNITS[i];
    $(id).textContent = String(value).padStart(2, "0");
  });

  const percent = clamp(
    (Date.now() - START) / (END - START) * 100, 0, 100
  );

  $("month-fill").style.width = `${percent.toFixed(1)}%`;
  $("month-text").textContent = `${percent.toFixed(1)}% Complete`;
}

updateCountdown();
setInterval(updateCountdown, 1000);
loadAllData();
</script>
